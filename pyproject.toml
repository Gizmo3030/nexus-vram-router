[project]
name = "nexus-vram-router"
version = "0.1.0"
description = "Ollama-compatible proxy that routes each request to the GPU node with room for the model."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gizmo" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/Gizmo3030/nexus-vram-router"
Issues = "https://github.com/Gizmo3030/nexus-vram-router/issues"

[project.scripts]
nexus-router = "nexus_router.main:router_main"
nexus-agent = "nexus_router.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_router"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
